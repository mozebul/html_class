        <td>0122363633</td>
      </tr>
      <tr>
        <td>2</td>

        <td>karim@gmail.com</td>
        <td>0126363633</td>
      </tr>
      <caption>
        User Information
      </caption>
    </table>

    <h3>4 Column X 4 row table with Emmet</h3>

      <tr>
        <td>ID</td>

      </tr>
      <tr>

      </tr>
      <tr>
        <td></td>

      </tr>
    </table>

    table>tr*4>td*4
  </body>
</html>
