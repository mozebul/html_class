<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>HTML Figure</title>
    <style>
      figure {
        border: 1px #cccccc solid;
        padding: 4px;
        margin: auto;
      }

      figcaption {
        background-color: black;
        color: white;
        font-style: italic;
        padding: 2px;
        text-align: center;
      }
    </style>
  </head>
  <body>
    <figure>
      <img src="images/tiger.jpg" width="100%" alt="" />
      <figcaption>Royal Bengal Tiger</figcaption>
    </figure>
  </body>
</html>
