<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Basic HTML Form</title>
</head>
<body>
    <h3>Basic HTML Form</h3>
    <form action="" method="get">
        <label for="">First Name:</label><br>
        <input type="text" name="fname" value="" placeholder="Enter your first name"><br>
        <label for="">Last Name:</label><br>
        <input type="text" name="lname" value="" placeholder="Enter your last name"><br>
        <label for="">Address:</label><br>
        <textarea name="address" placeholder="Enter your address" rows="6" cols="30"></textarea><br>
        <label for="">Gender:</label><br>
        <input type="radio" name="gender" value="m">Male
        <input type="radio" name="gender" value="f">Female
        <input type="radio" name="gender" value="o">Others <br>
        <label for="">District:</label><br>
        <select name="district" >
            <option value="" disabled>Select one</option>
            <option value="1">Dhaka</option>
            <option value="2" selected>Sylhet</option>
            <option value="3">Khulna</option>
            <option value="4">Cumilla</option>
        </select><br>
       <input type="submit" name="submit" value="SEND">
        <input type="reset" name="reset" value="RESET">        
    </form>

    <br><br>
</body>
</html>
